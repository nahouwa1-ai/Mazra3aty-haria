name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          unzip -o mazra3aty-haria.zip -d www
          ls -R www
      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json << 'CFG'
          {"appId":"com.mazraaty.haria","appName":"Haria","webDir":"www","server":{"androidScheme":"http","cleartext":true}}
          CFG
          npx cap add android
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Ù…Ø²Ø±Ø¹ØªÙŠ - haria</string>|' android/app/src/main/res/values/strings.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Show APK files
        run: find . -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: haria-apk
          path: android/**/*.apk
          if-no-files-found: error
